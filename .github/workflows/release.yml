name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: qntx/workflows/.github/workflows/release-rust.yml@v2
    permissions:
      contents: write
    with:
      bin: nosfry
      package: nosfry
      targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  taplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @taplo/cli@0.7.0 fmt --check

  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      deny: true
      doc: true
      package-check: true

  wasm:
    name: wasm32 check
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown
      packages: nosfry-core
      features: --all-features

  fuzz:
    uses: qntx/workflows/.github/workflows/ci-rust-fuzz.yml@v2
    permissions:
      contents: read
    with:
      max-total-time: 60

name               = "nosfry"
main               = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# The build needs a clang with wasm32 support in
# `CC_wasm32_unknown_unknown` (e.g. "$(brew --prefix llvm)/bin/clang").
# The workspace release profile strips symbols, which would drop the
# `target_features` section wasm-bindgen reads, so the build keeps it.
[build]
command = "CARGO_PROFILE_RELEASE_STRIP=false worker-build --release"

[durable_objects]
bindings = [{ name = "RELAY", class_name = "RelayObject" }]

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["RelayObject"]

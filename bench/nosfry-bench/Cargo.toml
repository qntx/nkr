[package]
name    = "nosfry-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap       = { version = "4.6", features = ["derive"] }
futures    = "0.3"
hdrhistogram = { version = "7.6.0", features = ["serialization"] }
negentropy = "=0.5.2"
rand = "0.10.3"
rand_chacha = "0.10.0"
secp256k1  = { version = "0.33.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2       = "0.11"
tokio      = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
url        = "2.5"
yawc       = { version = "0.5.0", default-features = false, features = ["tls", "rustls-ring"] }

[profile.release]
codegen-units = 1
lto           = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

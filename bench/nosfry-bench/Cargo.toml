[package]
name    = "nosfry-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap       = { version = "4.6", features = ["derive"] }
futures    = "0.3"
negentropy = "=0.5.2"
secp256k1  = { version = "0.33.1", default-features = false, features = ["std"] }
serde_json = "1"
sha2       = "0.11"
tokio      = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
url        = "2.5"
yawc       = "0.4.3"

[profile.release]
codegen-units = 1
lto           = "thin"
